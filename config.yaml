# XGBoost 训练配置文件

# 数据路径配置
data:
  feat_train: 'data_realtime/data_features_train.csv'
  label_train: 'data_realtime/data_label_train.csv'
  feat_test: 'data_realtime/test_df_feat.csv'
  label_test: 'data_realtime/test_df_lab.csv'

# 模型配置
model:
  mode: 'classification'  # 'regression' 或 'classification'
  random_seed: 42
  
  # 超参数搜索配置
  n_random_trials: 100
  early_stopping_rounds: 30
  num_boost_round: 1000
  verbose_xgb: 50
  
  # 验证集比例
  validation_ratio: 0.10

# 特征工程配置
feature_engineering:
  lag_length: 0  # 滞后特征长度
  group_key: null  # 分组键，如 'station_id'，null 表示全局
  
  # 保留列（不参与训练）
  reserved_columns:
    - 'info_date'
    - 'info_hour'
    - 'info_date_dt'
    - '_timestamp'
    - '_time_delta'
    - 'price_diff'
    - 'jingjiakongjian_shift_1'

# 样本权重配置
sample_weight:
  enabled: true
  eps: 1.0e-6
  alpha: 2  # 非线性权重指数

# 超参数搜索空间
hyperparameters:
  regression:
    n_estimators: [500, 1000, 1500, 2000]
    max_depth: [3, 4, 6, 8]
    learning_rate: [0.01, 0.02, 0.05, 0.1]
    subsample: [0.6, 0.8, 1.0]
    colsample_bytree: [0.6, 0.8, 1.0]
    gamma: [0, 0.1, 0.5]
  
  classification:
    n_estimators: [100, 200, 300, 500]
    max_depth: [3, 4, 6]
    learning_rate: [0.01, 0.02, 0.05, 0.1]
    subsample: [0.6, 0.8, 1.0]
    colsample_bytree: [0.6, 0.8, 1.0]

# 输出配置
output:
  dir_prefix: 'output'  # 输出目录前缀
  model_json: 'xgb_best_model.json'
  model_pickle: 'xgb_best_model.pkl'
  save_feature_importance: true
  
  # 可视化配置
  visualization:
    figure_size: [10, 6]
    dpi: 100
    style: 'whitegrid'

