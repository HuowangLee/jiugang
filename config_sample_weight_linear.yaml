# XGBoost 训练配置文件 - 线性样本权重示例

# 数据路径配置
data:
  data_type: 'price_diff'
  base_dir: 'data1year/data'
  feat_train: 'data_features_train.csv'
  label_train: 'data_label_train.csv'
  feat_test: 'test_df_feat.csv'
  label_test: 'test_df_lab.csv'

# 模型配置
model:
  mode: 'regression'
  random_seed: 42
  n_random_trials: 50
  early_stopping_rounds: 30
  num_boost_round: 1000
  verbose_xgb: 50
  validation_ratio: 0.10

# 特征工程配置
feature_engineering:
  lag_length: 0
  group_key: null
  reserved_columns:
    - 'info_date'
    - 'info_hour'
    - 'price_diff'
    - 'jingjiakongjian_shift_1'

# 样本权重配置 - 线性权重示例
sample_weight:
  enabled: true  # 启用样本权重
  weight_type: 'linear'  # 使用线性权重：weight = |price_diff| + eps
  eps: 0.01  # 最小权重基准值
  # 注意：linear模式下不使用alpha参数

# 超参数搜索空间
hyperparameters:
  regression:
    n_estimators: [500, 1000, 1500]
    max_depth: [3, 4, 6, 8]
    learning_rate: [0.01, 0.02, 0.05]
    subsample: [0.7, 0.8, 1.0]
    colsample_bytree: [0.7, 0.8, 1.0]
    gamma: [0, 0.1, 0.5]

# 输出配置
output:
  dir_prefix: 'output-linear-weight'
  model_json: 'xgb_best_model.json'
  model_pickle: 'xgb_best_model.pkl'
  save_feature_importance: true
  visualization:
    figure_size: [10, 6]
    dpi: 100
    style: 'whitegrid'

