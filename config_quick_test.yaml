# 快速测试配置（用于调试）

data:
  feat_train: 'data_realtime/data_features_train.csv'
  label_train: 'data_realtime/data_label_train.csv'
  feat_test: 'data_realtime/test_df_feat.csv'
  label_test: 'data_realtime/test_df_lab.csv'

model:
  mode: 'classification'
  random_seed: 42
  n_random_trials: 10  # 快速测试只做10次试验
  early_stopping_rounds: 10
  num_boost_round: 200  # 减少轮数
  verbose_xgb: 50
  validation_ratio: 0.10

feature_engineering:
  lag_length: 0
  group_key: null
  reserved_columns:
    - 'info_date'
    - 'info_hour'
    - 'info_date_dt'
    - '_timestamp'
    - '_time_delta'
    - 'price_diff'
    - 'jingjiakongjian_shift_1'

sample_weight:
  enabled: false  # 快速测试不启用权重

hyperparameters:
  regression:
    n_estimators: [100, 200]
    max_depth: [3, 4]
    learning_rate: [0.05, 0.1]
    subsample: [0.8, 1.0]
    colsample_bytree: [0.8, 1.0]
    gamma: [0, 0.1]
  
  classification:
    n_estimators: [100, 200]
    max_depth: [3, 4]
    learning_rate: [0.05, 0.1]
    subsample: [0.8, 1.0]
    colsample_bytree: [0.8, 1.0]

output:
  dir_prefix: 'output-quick-test'
  model_json: 'xgb_best_model.json'
  model_pickle: 'xgb_best_model.pkl'
  save_feature_importance: true
  visualization:
    figure_size: [10, 6]
    dpi: 100
    style: 'whitegrid'

